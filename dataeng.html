<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Engineering Learning Plan - Shadcn Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #09090b;
            --foreground: #fafafa;
            --card: #09090b;
            --card-foreground: #fafafa;
            --popover: #09090b;
            --popover-foreground: #fafafa;
            --primary: #fafafa;
            --primary-foreground: #18181b;
            --secondary: #27272a;
            --secondary-foreground: #fafafa;
            --muted: #27272a;
            --muted-foreground: #a1a1aa;
            --accent: #27272a;
            --accent-foreground: #fafafa;
            --destructive: #7f1d1d;
            --destructive-foreground: #fafafa;
            --border: #27272a;
            --input: #27272a;
            --ring: #d4d4d8;
            --radius: 0.5rem;
            
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
        }

        /* Layout */
        .sidebar {
            width: 280px;
            background-color: var(--background);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 2rem;
            padding: 0 0.75rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--foreground);
        }

        .nav-item {
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted-foreground);
        }

        .nav-item:hover {
            background-color: var(--accent);
            color: var(--accent-foreground);
        }

        .nav-item.active {
            background-color: var(--accent);
            color: var(--accent-foreground);
            font-weight: 600;
        }

        .nav-badge {
            background-color: var(--muted);
            color: var(--foreground);
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .nav-item.active .nav-badge {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .main-content {
            flex: 1;
            padding: 2.5rem 3rem;
            overflow-y: auto;
            background-color: var(--background);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            font-weight: 500;
            text-align: right;
        }

        .progress-bar-bg {
            width: 200px;
            height: 8px;
            background-color: var(--secondary);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Table Content */
        .table-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            vertical-align: middle;
        }

        th {
            color: var(--muted-foreground);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.02);
        }

        td {
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tool-name {
            font-weight: 500;
            color: var(--foreground);
        }

        /* Badges/Tags */
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            border: 1px solid var(--border);
            padding: 0.125rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .badge.outline {
            background-color: transparent;
            color: var(--foreground);
        }

        .badge.secondary {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
            border-color: transparent;
        }

        /* Select/Inputs Shadcn Style */
        .form-control {
            display: flex;
            height: 2.25rem;
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--input);
            background-color: transparent;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: var(--foreground);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 1px var(--ring);
        }

        .form-control::placeholder {
            color: var(--muted-foreground);
        }

        .status-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
            padding-right: 2rem;
        }

        .status-select option {
            background-color: var(--background);
            color: var(--foreground);
        }

        .status-select.completed { color: var(--success); border-color: rgba(16, 185, 129, 0.5); }
        .status-select.in-progress { color: var(--warning); border-color: rgba(245, 158, 11, 0.5); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
            DataEngPlan
        </div>
        <div id="nav-container">
            <!-- Nav items will be generated here -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1 id="category-title">Foundations</h1>
                <div style="margin-top: 10px;">
                    <select id="role-filter" class="form-control" style="width: auto; display: inline-block; padding-right: 2.5rem; background-color: var(--secondary); cursor: pointer;" onchange="updateRoleFilter(this.value)">
                        <option value="All">All Roles / Full Path</option>
                        <option value="Fresher">Fresher / Entry-Level</option>
                    </select>
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-text">
                    <div style="margin-bottom: 0.25rem;">Overall Progress</div>
                    <div style="font-weight: 700; color: var(--foreground);"><span id="progress-text">0</span>%</div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">Topic / Tool</th>
                        <th style="width: 10%;">Priority</th>
                        <th style="width: 15%;">Level</th>
                        <th style="width: 15%;">Status</th>
                        <th style="width: 15%;">Project</th>
                        <th style="width: 20%;">Notes</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Table rows will be generated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const planData = {
            "Foundations": [
                { name: "Computer Science Basics", priority: "High", level: "Beginner" },
                { name: "Linux Fundamentals", priority: "High", level: "Beginner" },
                { name: "Networking Basics", priority: "Medium", level: "Beginner" },
                { name: "Git & Version Control", priority: "High", level: "Beginner" },
                { name: "Agile & Scrum", priority: "Low", level: "Beginner" }
            ],
            "Programming Languages": [
                { name: "Python", priority: "High", level: "Beginner" },
                { name: "SQL", priority: "High", level: "Beginner" },
                { name: "Scala", priority: "Medium", level: "Intermediate" },
                { name: "Java", priority: "Medium", level: "Intermediate" },
                { name: "Go", priority: "Low", level: "Intermediate" }
            ],
            "Relational Databases (RDBMS)": [
                { name: "PostgreSQL", priority: "High", level: "Intermediate" },
                { name: "MySQL", priority: "High", level: "Beginner" },
                { name: "Database Design & Normalization", priority: "High", level: "Intermediate" },
                { name: "Indexes, Partitions & Query Tuning", priority: "High", level: "Advanced" }
            ],
            "NoSQL Databases": [
                { name: "MongoDB", priority: "Medium", level: "Intermediate" },
                { name: "Cassandra", priority: "Medium", level: "Advanced" },
                { name: "Redis", priority: "Medium", level: "Intermediate" },
                { name: "DynamoDB", priority: "High", level: "Intermediate" },
                { name: "Elasticsearch", priority: "Medium", level: "Intermediate" }
            ],
            "Data Warehousing": [
                { name: "Data Warehouse Concepts (OLAP vs OLTP)", priority: "High", level: "Intermediate" },
                { name: "Dimensional Modeling (Star/Snowflake Schema)", priority: "High", level: "Advanced" },
                { name: "Snowflake", priority: "High", level: "Intermediate" },
                { name: "Google BigQuery", priority: "High", level: "Intermediate" },
                { name: "Amazon Redshift", priority: "High", level: "Intermediate" }
            ],
            "Data Processing (Batch & Streaming)": [
                { name: "Apache Spark", priority: "High", level: "Advanced" },
                { name: "Apache Kafka", priority: "High", level: "Advanced" },
                { name: "Apache Flink", priority: "Medium", level: "Advanced" },
                { name: "Hadoop Ecosystem (HDFS, YARN)", priority: "Low", level: "Intermediate" },
                { name: "Pandas & Numpy", priority: "High", level: "Beginner" },
                { name: "dbt (Data Build Tool)", priority: "High", level: "Intermediate" }
            ],
            "Data Orchestration": [
                { name: "Apache Airflow", priority: "High", level: "Intermediate" },
                { name: "Prefect", priority: "Medium", level: "Intermediate" },
                { name: "Dagster", priority: "Medium", level: "Intermediate" },
                { name: "Mage.ai", priority: "Low", level: "Intermediate" }
            ],
            "Cloud Platforms": [
                { name: "AWS (S3, EMR, Athena, Glue)", priority: "High", level: "Intermediate" },
                { name: "Google Cloud Platform (GCS, Dataflow, Dataproc)", priority: "High", level: "Intermediate" },
                { name: "Microsoft Azure (Data Lake, Data Factory, Synapse)", priority: "Medium", level: "Intermediate" }
            ],
            "Data Quality, Governance & Catalog": [
                { name: "Great Expectations", priority: "High", level: "Intermediate" },
                { name: "Data Lineage Concepts", priority: "High", level: "Intermediate" },
                { name: "Amundsen / DataHub", priority: "Medium", level: "Advanced" },
                { name: "Apache Atlas", priority: "Low", level: "Advanced" }
            ],
            "Data Lake & Data Lakehouse": [
                { name: "Data Lake Concepts", priority: "High", level: "Intermediate" },
                { name: "Delta Lake", priority: "High", level: "Advanced" },
                { name: "Apache Iceberg", priority: "High", level: "Advanced" },
                { name: "Apache Hudi", priority: "Medium", level: "Advanced" },
                { name: "Databricks", priority: "High", level: "Advanced" }
            ],
            "DevOps & MLOps for Data Engineers": [
                { name: "Docker", priority: "High", level: "Intermediate" },
                { name: "Kubernetes", priority: "Medium", level: "Advanced" },
                { name: "CI/CD (GitHub Actions/GitLab CI)", priority: "High", level: "Intermediate" },
                { name: "Terraform / Infrastructure as Code", priority: "High", level: "Intermediate" }
            ],
            "Resume Standout Projects": [
                { name: "Project 1: Batch ETL Pipeline (Python, Pandas, PostgreSQL, Docker, Airflow)", priority: "High", level: "Intermediate" },
                { name: "Project 2: Modern Data Stack (AWS S3, BigQuery, dbt, Metabase)", priority: "High", level: "Advanced" },
                { name: "Project 3: Real-Time Streaming (Kafka, Python, Streamlit Dashboard)", priority: "High", level: "Advanced" }
            ]
        };

        let currentCategory = "Foundations";
        let userProgress = JSON.parse(localStorage.getItem('dataEngPlanProgress')) || {};
        let currentRole = localStorage.getItem('dataEngPlanRole') || "All";

        const fresherTools = [
            "Computer Science Basics", "Linux Fundamentals", "Git & Version Control",
            "Python", "SQL",
            "PostgreSQL", "MySQL", "Database Design & Normalization",
            "Pandas & Numpy",
            "Data Warehouse Concepts (OLAP vs OLTP)",
            "Apache Airflow",
            "Docker", "AWS (S3, EMR, Athena, Glue)", "Google Cloud Platform (GCS, Dataflow, Dataproc)",
            "Project 1: Batch ETL Pipeline (Python, Pandas, PostgreSQL, Docker, Airflow)",
            "Project 2: Modern Data Stack (AWS S3, BigQuery, dbt, Metabase)",
            "Project 3: Real-Time Streaming (Kafka, Python, Streamlit Dashboard)"
        ];

        function init() {
            document.getElementById('role-filter').value = currentRole;
            renderNav();
            renderTable();
            updateOverallProgress();
        }

        function updateRoleFilter(role) {
            currentRole = role;
            localStorage.setItem('dataEngPlanRole', role);
            renderNav();
            renderTable();
            updateOverallProgress();
        }

        function getFilteredTools(category) {
            if (currentRole === 'Fresher') {
                return planData[category].filter(t => fresherTools.includes(t.name));
            }
            return planData[category];
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = '';
            
            let firstValidCategory = null;

            Object.keys(planData).forEach(category => {
                const tools = getFilteredTools(category);
                if (tools.length === 0) return; // Hide empty categories

                if (!firstValidCategory) firstValidCategory = category;

                const item = document.createElement('div');
                item.className = `nav-item ${category === currentCategory ? 'active' : ''}`;
                item.onclick = () => {
                    currentCategory = category;
                    renderNav();
                    renderTable();
                };

                const title = document.createElement('span');
                title.textContent = category;

                const badge = document.createElement('span');
                badge.className = 'nav-badge';
                badge.textContent = tools.length;

                item.appendChild(title);
                item.appendChild(badge);
                navContainer.appendChild(item);
            });

            if (getFilteredTools(currentCategory).length === 0 && firstValidCategory) {
                currentCategory = firstValidCategory;
                setTimeout(() => { renderNav(); renderTable(); }, 0);
            }
        }

        function renderTable() {
            document.getElementById('category-title').textContent = currentCategory;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const tools = getFilteredTools(currentCategory);

            tools.forEach(tool => {
                const tr = document.createElement('tr');
                
                // Initialize default state if not exists
                if(!userProgress[tool.name]) {
                    userProgress[tool.name] = { status: 'not-started', project: '', notes: '' };
                }

                const state = userProgress[tool.name];

                tr.innerHTML = `
                    <td>
                        <div class="tool-name">${tool.name}</div>
                    </td>
                    <td><span class="badge outline">${tool.priority}</span></td>
                    <td><span class="badge secondary">${tool.level}</span></td>
                    <td>
                        <select class="form-control status-select ${state.status}" onchange="updateStatus(this, '${tool.name}')">
                            <option value="not-started" ${state.status === 'not-started' ? 'selected' : ''}>○ Not Started</option>
                            <option value="in-progress" ${state.status === 'in-progress' ? 'selected' : ''}>◐ In Progress</option>
                            <option value="completed" ${state.status === 'completed' ? 'selected' : ''}>● Completed</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Project name" value="${state.project}" onchange="saveData('${tool.name}', 'project', this.value)">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Notes..." value="${state.notes}" onchange="saveData('${tool.name}', 'notes', this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatus(selectElement, toolName) {
            const newStatus = selectElement.value;
            selectElement.className = `form-control status-select ${newStatus}`;
            saveData(toolName, 'status', newStatus);
            updateOverallProgress();
        }

        function saveData(toolName, key, value) {
            if(!userProgress[toolName]) userProgress[toolName] = {};
            userProgress[toolName][key] = value;
            localStorage.setItem('dataEngPlanProgress', JSON.stringify(userProgress));
        }

        function updateOverallProgress() {
            let total = 0;
            let completed = 0;

            Object.keys(planData).forEach(category => {
                const tools = getFilteredTools(category);
                tools.forEach(tool => {
                    total++;
                    if(userProgress[tool.name] && userProgress[tool.name].status === 'completed') {
                        completed++;
                    }
                });
            });

            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('progress-text').textContent = percentage;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        init();
    </script>
</body>
</html>
