<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Learning Plan - Shadcn Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #09090b;
            --foreground: #fafafa;
            --card: #09090b;
            --card-foreground: #fafafa;
            --popover: #09090b;
            --popover-foreground: #fafafa;
            --primary: #fafafa;
            --primary-foreground: #18181b;
            --secondary: #27272a;
            --secondary-foreground: #fafafa;
            --muted: #27272a;
            --muted-foreground: #a1a1aa;
            --accent: #27272a;
            --accent-foreground: #fafafa;
            --destructive: #7f1d1d;
            --destructive-foreground: #fafafa;
            --border: #27272a;
            --input: #27272a;
            --ring: #d4d4d8;
            --radius: 0.5rem;
            
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
        }

        /* Layout */
        .sidebar {
            width: 280px;
            background-color: var(--background);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        .logo {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 2rem;
            padding: 0 0.75rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--foreground);
        }

        .nav-item {
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted-foreground);
        }

        .nav-item:hover {
            background-color: var(--accent);
            color: var(--accent-foreground);
        }

        .nav-item.active {
            background-color: var(--accent);
            color: var(--accent-foreground);
            font-weight: 600;
        }

        .nav-badge {
            background-color: var(--muted);
            color: var(--foreground);
            padding: 0.1rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .nav-item.active .nav-badge {
            background-color: var(--primary);
            color: var(--primary-foreground);
        }

        .main-content {
            flex: 1;
            padding: 2.5rem 3rem;
            overflow-y: auto;
            background-color: var(--background);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            font-weight: 500;
            text-align: right;
        }

        .progress-bar-bg {
            width: 200px;
            height: 8px;
            background-color: var(--secondary);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Table Content */
        .table-container {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            vertical-align: middle;
        }

        th {
            color: var(--muted-foreground);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            background-color: rgba(255, 255, 255, 0.02);
        }

        td {
            border-bottom: 1px solid var(--border);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tool-name {
            font-weight: 500;
            color: var(--foreground);
        }

        /* Badges/Tags */
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            border: 1px solid var(--border);
            padding: 0.125rem 0.625rem;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .badge.outline {
            background-color: transparent;
            color: var(--foreground);
        }

        .badge.secondary {
            background-color: var(--secondary);
            color: var(--secondary-foreground);
            border-color: transparent;
        }

        /* Select/Inputs Shadcn Style */
        .form-control {
            display: flex;
            height: 2.25rem;
            width: 100%;
            border-radius: var(--radius);
            border: 1px solid var(--input);
            background-color: transparent;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: var(--foreground);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 1px var(--ring);
        }

        .form-control::placeholder {
            color: var(--muted-foreground);
        }

        .status-select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1em;
            padding-right: 2rem;
        }

        .status-select option {
            background-color: var(--background);
            color: var(--foreground);
        }

        .status-select.completed { color: var(--success); border-color: rgba(16, 185, 129, 0.5); }
        .status-select.in-progress { color: var(--warning); border-color: rgba(245, 158, 11, 0.5); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            DevOpsPlan
        </div>
        <div id="nav-container">
            <!-- Nav items will be generated here -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 id="category-title">Foundations</h1>
            <div class="progress-container">
                <div class="progress-text">
                    <div style="margin-bottom: 0.25rem;">Overall Progress</div>
                    <div style="font-weight: 700; color: var(--foreground);"><span id="progress-text">0</span>%</div>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">Topic / Tool</th>
                        <th style="width: 10%;">Priority</th>
                        <th style="width: 15%;">Level</th>
                        <th style="width: 15%;">Status</th>
                        <th style="width: 15%;">Project</th>
                        <th style="width: 20%;">Notes</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Table rows will be generated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const planData = {
            "Foundations": [
                { name: "Linux Fundamentals", priority: "High", level: "Beginner" },
                { name: "Shell Scripting (Bash)", priority: "High", level: "Intermediate" },
                { name: "Networking Fundamentals", priority: "High", level: "Beginner" },
                { name: "HTTP, HTTPS, DNS", priority: "High", level: "Beginner" },
                { name: "Git", priority: "High", level: "Beginner" },
                { name: "GitHub", priority: "High", level: "Beginner" },
                { name: "GitLab", priority: "Medium", level: "Beginner" },
                { name: "Bitbucket", priority: "Low", level: "Beginner" },
                { name: "Python", priority: "High", level: "Beginner" },
                { name: "SQL", priority: "High", level: "Beginner" },
                { name: "PostgreSQL", priority: "High", level: "Intermediate" },
                { name: "MySQL", priority: "Medium", level: "Intermediate" }
            ],
            "AWS Cloud": [
                { name: "AWS IAM", priority: "High", level: "Beginner" },
                { name: "AWS EC2", priority: "High", level: "Beginner" },
                { name: "AWS Auto Scaling", priority: "High", level: "Intermediate" },
                { name: "AWS ELB", priority: "High", level: "Intermediate" },
                { name: "AWS S3", priority: "High", level: "Beginner" },
                { name: "AWS EBS", priority: "High", level: "Beginner" },
                { name: "AWS EFS", priority: "Medium", level: "Beginner" },
                { name: "AWS VPC", priority: "High", level: "Intermediate" },
                { name: "Security Groups", priority: "High", level: "Intermediate" },
                { name: "NACL", priority: "Medium", level: "Intermediate" },
                { name: "Route Tables", priority: "High", level: "Intermediate" },
                { name: "NAT Gateway", priority: "Medium", level: "Intermediate" },
                { name: "Internet Gateway", priority: "High", level: "Beginner" },
                { name: "AWS RDS", priority: "High", level: "Intermediate" },
                { name: "DynamoDB", priority: "Medium", level: "Intermediate" },
                { name: "ElastiCache", priority: "Low", level: "Intermediate" },
                { name: "AWS Lambda", priority: "High", level: "Intermediate" },
                { name: "API Gateway", priority: "High", level: "Intermediate" },
                { name: "CloudFront", priority: "Medium", level: "Intermediate" },
                { name: "Route 53", priority: "High", level: "Intermediate" },
                { name: "AWS SQS", priority: "Medium", level: "Advanced" },
                { name: "AWS SNS", priority: "Medium", level: "Advanced" },
                { name: "EventBridge", priority: "Low", level: "Advanced" },
                { name: "Step Functions", priority: "Low", level: "Advanced" },
                { name: "CloudWatch", priority: "High", level: "Beginner" },
                { name: "CloudTrail", priority: "Medium", level: "Intermediate" },
                { name: "AWS Config", priority: "Medium", level: "Intermediate" },
                { name: "KMS", priority: "Medium", level: "Advanced" },
                { name: "Secrets Manager", priority: "High", level: "Intermediate" },
                { name: "WAF", priority: "Low", level: "Advanced" },
                { name: "Cognito", priority: "Low", level: "Advanced" },
                { name: "AWS Organizations", priority: "Low", level: "Intermediate" },
                { name: "ECS", priority: "High", level: "Intermediate" },
                { name: "ECR", priority: "High", level: "Intermediate" },
                { name: "EKS", priority: "High", level: "Advanced" }
            ],
            "Containers & Web Servers": [
                { name: "Docker", priority: "High", level: "Beginner" },
                { name: "Docker Compose", priority: "High", level: "Intermediate" },
                { name: "Docker Hub", priority: "High", level: "Beginner" },
                { name: "Nginx", priority: "High", level: "Intermediate" },
                { name: "Apache HTTP Server", priority: "Low", level: "Intermediate" },
                { name: "HAProxy", priority: "Medium", level: "Advanced" }
            ],
            "CI/CD": [
                { name: "CI/CD Concepts", priority: "High", level: "Beginner" },
                { name: "Jenkins", priority: "High", level: "Intermediate" },
                { name: "GitHub Actions", priority: "High", level: "Beginner" },
                { name: "GitLab CI/CD", priority: "Medium", level: "Intermediate" }
            ],
            "Infrastructure as Code": [
                { name: "Terraform", priority: "High", level: "Intermediate" },
                { name: "Terraform State", priority: "High", level: "Intermediate" },
                { name: "Terraform Modules", priority: "High", level: "Advanced" },
                { name: "CloudFormation", priority: "Medium", level: "Intermediate" },
                { name: "AWS CDK", priority: "Low", level: "Advanced" },
                { name: "Ansible", priority: "High", level: "Intermediate" },
                { name: "Puppet", priority: "Low", level: "Intermediate" },
                { name: "Chef", priority: "Low", level: "Intermediate" }
            ],
            "Kubernetes": [
                { name: "Kubernetes Architecture", priority: "High", level: "Beginner" },
                { name: "Pods", priority: "High", level: "Beginner" },
                { name: "Deployments", priority: "High", level: "Intermediate" },
                { name: "ReplicaSets", priority: "High", level: "Beginner" },
                { name: "Services", priority: "High", level: "Intermediate" },
                { name: "Namespaces", priority: "High", level: "Beginner" },
                { name: "ConfigMaps", priority: "High", level: "Intermediate" },
                { name: "Secrets", priority: "High", level: "Intermediate" },
                { name: "Persistent Volumes", priority: "High", level: "Advanced" },
                { name: "Persistent Volume Claims", priority: "High", level: "Advanced" },
                { name: "StatefulSets", priority: "Medium", level: "Advanced" },
                { name: "DaemonSets", priority: "Medium", level: "Advanced" },
                { name: "Jobs", priority: "Medium", level: "Intermediate" },
                { name: "CronJobs", priority: "Medium", level: "Intermediate" },
                { name: "Ingress", priority: "High", level: "Advanced" },
                { name: "Helm", priority: "High", level: "Intermediate" },
                { name: "ArgoCD", priority: "High", level: "Advanced" },
                { name: "FluxCD", priority: "Medium", level: "Advanced" },
                { name: "Istio", priority: "Medium", level: "Advanced" }
            ],
            "Monitoring & Logging": [
                { name: "Prometheus", priority: "High", level: "Intermediate" },
                { name: "Grafana", priority: "High", level: "Intermediate" },
                { name: "Alertmanager", priority: "High", level: "Intermediate" },
                { name: "ELK Stack", priority: "Medium", level: "Advanced" },
                { name: "Loki", priority: "Medium", level: "Advanced" },
                { name: "Tempo", priority: "Low", level: "Advanced" },
                { name: "OpenTelemetry", priority: "Medium", level: "Advanced" },
                { name: "Fluentd", priority: "Medium", level: "Intermediate" }
            ],
            "DevSecOps": [
                { name: "SonarQube", priority: "High", level: "Intermediate" },
                { name: "Trivy", priority: "Medium", level: "Intermediate" },
                { name: "Gitleaks", priority: "Medium", level: "Beginner" },
                { name: "HashiCorp Vault", priority: "High", level: "Advanced" },
                { name: "OWASP Top 10", priority: "High", level: "Beginner" },
                { name: "SAST", priority: "Medium", level: "Intermediate" },
                { name: "DAST", priority: "Medium", level: "Advanced" }
            ],
            "Data & Messaging": [
                { name: "Kafka", priority: "Medium", level: "Advanced" },
                { name: "RabbitMQ", priority: "Medium", level: "Intermediate" },
                { name: "Apache Airflow", priority: "Low", level: "Advanced" },
                { name: "Hadoop", priority: "Low", level: "Advanced" },
                { name: "Spark", priority: "Low", level: "Advanced" },
                { name: "Spark Streaming", priority: "Low", level: "Advanced" },
                { name: "Flink", priority: "Low", level: "Advanced" }
            ],
            "Testing": [
                { name: "Postman", priority: "High", level: "Beginner" },
                { name: "Pytest", priority: "Medium", level: "Intermediate" },
                { name: "JUnit", priority: "Low", level: "Intermediate" }
            ],
            "SRE & Architecture": [
                { name: "SLI", priority: "High", level: "Beginner" },
                { name: "SLO", priority: "High", level: "Intermediate" },
                { name: "SLA", priority: "High", level: "Intermediate" },
                { name: "Incident Management", priority: "High", level: "Intermediate" },
                { name: "Error Budgets", priority: "Medium", level: "Advanced" },
                { name: "High Availability", priority: "High", level: "Intermediate" },
                { name: "Disaster Recovery", priority: "High", level: "Advanced" },
                { name: "Blue-Green Deployment", priority: "High", level: "Intermediate" },
                { name: "Canary Deployment", priority: "High", level: "Intermediate" }
            ]
        };

        let currentCategory = "Foundations";
        let userProgress = JSON.parse(localStorage.getItem('devopsPlanProgress2')) || {};

        function init() {
            renderNav();
            renderTable();
            updateOverallProgress();
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = '';

            Object.keys(planData).forEach(category => {
                const item = document.createElement('div');
                item.className = `nav-item ${category === currentCategory ? 'active' : ''}`;
                item.onclick = () => {
                    currentCategory = category;
                    renderNav();
                    renderTable();
                };

                const title = document.createElement('span');
                title.textContent = category;

                const badge = document.createElement('span');
                badge.className = 'nav-badge';
                badge.textContent = planData[category].length;

                item.appendChild(title);
                item.appendChild(badge);
                navContainer.appendChild(item);
            });
        }

        function renderTable() {
            document.getElementById('category-title').textContent = currentCategory;
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const tools = planData[currentCategory];

            tools.forEach(tool => {
                const tr = document.createElement('tr');
                
                // Initialize default state if not exists
                if(!userProgress[tool.name]) {
                    userProgress[tool.name] = { status: 'not-started', project: '', notes: '' };
                }

                const state = userProgress[tool.name];

                tr.innerHTML = `
                    <td>
                        <div class="tool-name">${tool.name}</div>
                    </td>
                    <td><span class="badge outline">${tool.priority}</span></td>
                    <td><span class="badge secondary">${tool.level}</span></td>
                    <td>
                        <select class="form-control status-select ${state.status}" onchange="updateStatus(this, '${tool.name}')">
                            <option value="not-started" ${state.status === 'not-started' ? 'selected' : ''}>○ Not Started</option>
                            <option value="in-progress" ${state.status === 'in-progress' ? 'selected' : ''}>◐ In Progress</option>
                            <option value="completed" ${state.status === 'completed' ? 'selected' : ''}>● Completed</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Project name" value="${state.project}" onchange="saveData('${tool.name}', 'project', this.value)">
                    </td>
                    <td>
                        <input type="text" class="form-control" placeholder="Notes..." value="${state.notes}" onchange="saveData('${tool.name}', 'notes', this.value)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatus(selectElement, toolName) {
            const newStatus = selectElement.value;
            selectElement.className = `form-control status-select ${newStatus}`;
            saveData(toolName, 'status', newStatus);
            updateOverallProgress();
        }

        function saveData(toolName, key, value) {
            if(!userProgress[toolName]) userProgress[toolName] = {};
            userProgress[toolName][key] = value;
            localStorage.setItem('devopsPlanProgress2', JSON.stringify(userProgress));
        }

        function updateOverallProgress() {
            let total = 0;
            let completed = 0;

            Object.values(planData).forEach(tools => {
                tools.forEach(tool => {
                    total++;
                    if(userProgress[tool.name] && userProgress[tool.name].status === 'completed') {
                        completed++;
                    }
                });
            });

            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('progress-text').textContent = percentage;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        init();
    </script>
</body>
</html>
